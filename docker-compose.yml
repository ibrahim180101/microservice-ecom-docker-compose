services:
  main-service:
    build: ./main-service
    restart: unless-stopped
    networks: [app-network]
  product-service:
    build: ./product-service
    restart: unless-stopped
    networks: [app-network]
  cart-service:
    build: ./cart-service
    restart: unless-stopped
    networks: [app-network]
  user-service:
    build: ./user-service
    restart: unless-stopped
    networks: [app-network]
  order-service:
    build: ./order-service
    restart: unless-stopped
    networks: [app-network]
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - main-service
      - product-service
      - cart-service
      - user-service
      - order-service
    restart: unless-stopped
    networks: [app-network]
networks:
  app-network:
    driver: bridge

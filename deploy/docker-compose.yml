services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Docker EC2 deployment .env file}
      POSTGRES_DB: nova
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [microservices-network]
  main-service:
    image: 003720988361.dkr.ecr.ap-south-1.amazonaws.com/main-service:${IMAGE_TAG}
    container_name: main-service
    restart: unless-stopped
    networks: [microservices-network]
  user-service:
    image: 003720988361.dkr.ecr.ap-south-1.amazonaws.com/user-service:${IMAGE_TAG}
    container_name: user-service
    environment:
      DATA_DIR: /app/data
      SERVICE_NAME: user-service
    volumes:
      - user-service-data:/app/data
    restart: unless-stopped
    networks: [microservices-network]
  product-service:
    image: 003720988361.dkr.ecr.ap-south-1.amazonaws.com/product-service:${IMAGE_TAG}
    container_name: product-service
    environment:
      DATA_DIR: /app/data
      SERVICE_NAME: product-service
    volumes:
      - product-service-data:/app/data
    restart: unless-stopped
    networks: [microservices-network]
  cart-service:
    image: 003720988361.dkr.ecr.ap-south-1.amazonaws.com/cart-service:${IMAGE_TAG}
    container_name: cart-service
    restart: unless-stopped
    networks: [microservices-network]
  order-service:
    image: 003720988361.dkr.ecr.ap-south-1.amazonaws.com/order-service:${IMAGE_TAG}
    container_name: order-service
    environment:
      DATA_DIR: /app/data
      SERVICE_NAME: order-service
    volumes:
      - order-service-data:/app/data
    restart: unless-stopped
    networks: [microservices-network]
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - main-service
      - user-service
      - product-service
      - cart-service
      - order-service
    networks: [microservices-network]
networks:
  microservices-network:
    driver: bridge

volumes:
  postgres-data:
  user-service-data:
  product-service-data:
  order-service-data:

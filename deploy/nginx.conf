server {
    listen 80;
    server_name _;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    location /api/auth/ { proxy_pass http://user-service:3000; }
    location = /api/users { proxy_pass http://user-service:3000; }
    location /api/users/ { proxy_pass http://user-service:3000; }
    location = /api/products { proxy_pass http://product-service:3000; }
    location /api/products/ { proxy_pass http://product-service:3000; }
    location /api/checkout/ { proxy_pass http://order-service:3000; }
    location = /api/orders { proxy_pass http://order-service:3000; }
    location /api/orders/ { proxy_pass http://order-service:3000; }
    location = / {
        proxy_pass http://main-service:80/;
        proxy_set_header Host $host;
    }
    location = /user { return 301 /users/; }
    location = /user/ { return 301 /users/; }
    location = /users { return 301 /users/; }
    location = /products { return 301 /products/; }
    location = /cart { return 301 /cart/; }
    location = /orders { return 301 /orders/; }
    location /users/ {
        proxy_pass http://user-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /products/ {
        proxy_pass http://product-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /cart/ {
        proxy_pass http://cart-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /orders/ {
        proxy_pass http://order-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
